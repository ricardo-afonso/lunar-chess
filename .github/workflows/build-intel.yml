name: Build Intel macOS with transparency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          repository: namecallfilter/lunar-chess
          ref: v0.3.6
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Patch macOS transparency
        run: |
          SOFTBUFFER_MANIFEST="$(
            cargo metadata --format-version 1 |
            jq -r '.packages[] | select(.name == "softbuffer") | .manifest_path'
          )"

          SOFTBUFFER_CG="$(
            dirname "$SOFTBUFFER_MANIFEST"
          )/src/backends/cg.rs"

          grep -q "kCGImageAlphaNoneSkipFirst" "$SOFTBUFFER_CG"

          sed -i '' \
            's/kCGImageAlphaNoneSkipFirst/kCGImageAlphaPremultipliedFirst/g' \
            "$SOFTBUFFER_CG"

          perl -0pi -e \
            's/let layer = CALayer::new\(\);/let layer = CALayer::new();\n        root_layer.setOpaque(false);\n        layer.setOpaque(false);/' \
            "$SOFTBUFFER_CG"

          grep -q "kCGImageAlphaPremultipliedFirst" "$SOFTBUFFER_CG"
          grep -q "root_layer.setOpaque(false)" "$SOFTBUFFER_CG"

          touch "$SOFTBUFFER_CG"
          cargo clean -p softbuffer

      - name: Build Lunar Chess
        run: cargo build --release

      - name: Verify and package Intel binary
        run: |
          file target/release/lunar-chess
          test "$(lipo -archs target/release/lunar-chess)" = "x86_64"
          codesign --force --sign - target/release/lunar-chess
          tar -czf lunar-chess-intel-transparent.tar.gz \
            -C target/release lunar-chess

      - name: Upload patched build
        uses: actions/upload-artifact@v5
        with:
          name: lunar-chess-intel-transparent-${{ github.run_number }}
          path: lunar-chess-intel-transparent.tar.gz
          retention-days: 7